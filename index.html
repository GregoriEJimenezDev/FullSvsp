<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVSP</title>
    <style>
      :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        text-align: center;
        padding: 2rem;
        max-width: 720px;
      }
      h1 { margin-bottom: 0.5rem; }
      p { line-height: 1.6; }
      code {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: #1e293b;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SVSP</h1>
      <p>Sitio estático para GitHub Pages.</p>
      <p>El backend Express sigue en el repositorio, pero esta página evita el error 404 del despliegue.</p>
      <code>Deploy listo</code>
    </main>
  </body>
</html>
